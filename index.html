<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Secret Santa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#16302A;
    --pine-deep:#0C1E19;
    --paper:#F7F1E2;
    --cranberry:#9E2A44;
    --cranberry-dark:#7E2036;
    --gold:#C6A15B;
    --ink:#241F19;
    --ink-soft:#5B5347;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 15%, rgba(198,161,91,0.08), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(158,42,68,0.12), transparent 45%),
      var(--pine-deep);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--paper);
    border-radius:14px;
    max-width:420px;
    width:100%;
    padding:40px 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
    position:relative;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.9rem;
    line-height:1.15;
    margin:0 0 8px;
    color:var(--pine);
  }
  .sub{
    font-size:0.94rem;
    color:var(--ink-soft);
    margin:0 0 26px;
    line-height:1.5;
  }
  label{
    display:block;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  input[type="text"], input[type="password"], select{
    width:100%;
    padding:12px 14px;
    border:1px solid #DDD3BE;
    border-radius:8px;
    font-family:'Inter', sans-serif;
    font-size:0.98rem;
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  button{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    border:none;
    border-radius:8px;
    padding:12px 18px;
    cursor:pointer;
    transition:transform 0.12s ease, background 0.15s ease;
  }
  button:active{transform:scale(0.98);}
  .btn-primary{
    background:var(--cranberry);
    color:var(--paper);
    width:100%;
    margin-top:16px;
  }
  .btn-primary:hover{background:var(--cranberry-dark);}
  .btn-primary:disabled{background:#C9BEA8;cursor:not-allowed;}
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    padding:6px 8px;
    font-weight:500;
    font-size:0.82rem;
    text-decoration:underline;
  }
  .field{margin-top:14px;}
  .result{
    text-align:center;
    padding-top:6px;
    animation:reveal 0.5s ease;
  }
  @keyframes reveal{
    from{opacity:0; transform:translateY(8px) scale(0.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .result .for{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .result .name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:2.1rem;
    color:var(--cranberry);
    margin:0 0 10px;
  }
  .result .note{
    font-size:0.85rem;
    color:var(--ink-soft);
  }
  .error{
    background:#FBE6E6;
    color:#8A2E2E;
    border-radius:8px;
    padding:10px 12px;
    font-size:0.85rem;
    margin-top:14px;
  }
  .foot-link{
    text-align:center;
    margin-top:24px;
  }
  .list-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid #E7DCC4;
    font-size:0.9rem;
  }
  .list-row .nm{flex:1;}
  .list-row .partner-tag{
    font-size:0.75rem;
    color:var(--ink-soft);
  }
  .remove-x{
    background:none;
    border:none;
    color:#8A2E2E;
    cursor:pointer;
    font-size:1rem;
    padding:2px 6px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    margin-top:14px;
    font-size:0.88rem;
  }
  table th, table td{
    text-align:left;
    padding:7px 4px;
    border-bottom:1px solid #E7DCC4;
  }
  .hint{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .row-flex{display:flex; gap:8px;}
  .row-flex input, .row-flex select{flex:1;}
  .row-flex button{flex-shrink:0;}
</style>
</head>
<body>

<div class="card" id="app">
  <div id="loading" class="sub">Loading…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCTMYooFcdGHlDiQ7ota_B1mtd0ewe8jaY",
  authDomain: "family-secret-santa-b32ac.firebaseapp.com",
  projectId: "family-secret-santa-b32ac",
  storageBucket: "family-secret-santa-b32ac.firebasestorage.app",
  messagingSenderId: "92749862822",
  appId: "1:92749862822:web:39f963d158af2974eea167"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const stateDoc = db.collection('secretSanta').doc('state');

const ADMIN_CODE = 'evergreen2026';

let participants = [];
let assignments = null;
let view = 'home'; // home | result | admin-gate | admin

function randomPin(){
  return String(Math.floor(1000 + Math.random() * 9000));
}

const DEFAULT_PARTICIPANTS = (() => {
  const pairs = [['Aman','Yara'], ['Lucas','Lali'], ['Fiona','Julian']];
  const singles = ['Theresa'];
  const list = [];
  pairs.forEach(([n1, n2], i) => {
    const id1 = 'p_seed_' + i + 'a';
    const id2 = 'p_seed_' + i + 'b';
    list.push({ id: id1, name: n1, partnerId: id2, pin: randomPin() });
    list.push({ id: id2, name: n2, partnerId: id1, pin: randomPin() });
  });
  singles.forEach((n, i) => {
    list.push({ id: 'p_seed_single' + i, name: n, partnerId: null, pin: randomPin() });
  });
  return list;
})();

async function loadState(){
  try{
    const snap = await stateDoc.get();
    if(snap.exists){
      const data = snap.data();
      participants = data.participants || [];
      assignments = data.assignments || null;
      let patched = false;
      participants.forEach(person => {
        if(!person.pin){ person.pin = randomPin(); patched = true; }
      });
      if(patched) await saveParticipants();
    } else {
      participants = DEFAULT_PARTICIPANTS;
      assignments = null;
      await stateDoc.set({ participants, assignments: null });
    }
  }catch(e){
    console.error(e);
    participants = DEFAULT_PARTICIPANTS;
    assignments = null;
  }
}

async function saveParticipants(){
  await stateDoc.set({ participants }, { merge: true });
}
async function saveAssignments(){
  await stateDoc.set({ assignments }, { merge: true });
}

function normalize(name){
  return name.trim().toLowerCase();
}

function render(){
  const app = document.getElementById('app');
  if(view === 'home') app.innerHTML = homeHTML();
  else if(view === 'result') app.innerHTML = resultHTML();
  else if(view === 'admin-gate') app.innerHTML = adminGateHTML();
  else if(view === 'admin') app.innerHTML = adminHTML();
  bindEvents();
}

function homeHTML(){
  return `
    <h1>Who are you buying for?</h1>
    <p class="sub">Type your name to see who you've drawn this year. Only you'll see your own match.</p>
    <div class="field">
      <label for="nameInput">Your name</label>
      <input type="text" id="nameInput" placeholder="e.g. Aman" autocomplete="off">
    </div>
    <div class="field">
      <label for="pinInput">Your PIN</label>
      <input type="text" id="pinInput" placeholder="4-digit PIN" inputmode="numeric" maxlength="4" autocomplete="off">
    </div>
    <button class="btn-primary" id="revealBtn">Reveal my person</button>
    <div id="errorSlot"></div>
    <div class="foot-link"><button class="btn-ghost" id="adminLink">Admin</button></div>
  `;
}

function resultHTML(){
  return `
    <div class="result">
      <p class="for">You're buying a gift for</p>
      <p class="name">${window.__lastReceiver}</p>
      <p class="note">Keep it between us 🎄</p>
    </div>
    <button class="btn-primary" id="backBtn" style="background:transparent;color:var(--ink-soft);border:1px solid #DDD3BE;">Back</button>
  `;
}

function adminGateHTML(){
  return `
    <h1>Admin</h1>
    <p class="sub">Enter the admin passcode to manage the family list and run the draw.</p>
    <div class="field">
      <label for="pass">Passcode</label>
      <input type="password" id="pass" placeholder="Passcode">
    </div>
    <button class="btn-primary" id="unlockBtn">Unlock</button>
    <div id="errorSlot"></div>
    <div class="foot-link"><button class="btn-ghost" id="backHomeBtn">Back to draw</button></div>
  `;
}

function adminHTML(){
  const rows = participants.map(p => {
    const partner = participants.find(x => x.id === p.partnerId);
    return `
      <div class="list-row">
        <span class="nm">${p.name}${partner ? `<span class="partner-tag"> — paired with ${partner.name}</span>` : ''}<span class="partner-tag"> · PIN ${p.pin}</span></span>
        <button class="remove-x" data-remove="${p.id}" title="Remove">✕</button>
      </div>`;
  }).join('') || '<p class="hint">No one added yet.</p>';

  const options = participants.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

  const assignmentTable = assignments ? `
    <h1 style="font-size:1.3rem;margin-top:28px;">Current draw</h1>
    <p class="hint">You can manually change who someone's buying for using the dropdowns below.</p>
    <table>
      <tr><th>Giver</th><th>Buying for</th></tr>
      ${Object.entries(assignments).map(([giverId, receiverId]) => {
        const g = participants.find(p => p.id === giverId);
        const receiverOptions = participants
          .filter(p => p.id !== giverId)
          .map(p => `<option value="${p.id}" ${p.id === receiverId ? 'selected' : ''}>${p.name}</option>`)
          .join('');
        return `<tr><td>${g ? g.name : '?'}</td><td><select data-giver="${giverId}" class="assign-select">${receiverOptions}</select></td></tr>`;
      }).join('')}
    </table>
    <button class="btn-primary" id="saveAssignBtn" style="background:var(--pine);">Save changes</button>
    <div id="assignWarning"></div>
    <button class="btn-primary" id="resetBtn" style="background:var(--ink-soft);">Reset and re-draw</button>
  ` : `
    <button class="btn-primary" id="drawBtn" ${participants.length < 3 ? 'disabled' : ''}>Run the draw</button>
    <p class="hint">${participants.length < 3 ? 'Add at least 3 people first.' : `${participants.length} people ready.`}</p>
  `;

  return `
    <h1>Family list</h1>
    <p class="sub">Add everyone, pair up couples, then run the draw once.</p>
    <div class="row-flex">
      <input type="text" id="newName" placeholder="Add a name">
      <button class="btn-primary" id="addBtn" style="margin-top:0;width:auto;">Add</button>
    </div>
    <div style="margin-top:18px;">${rows}</div>
    ${participants.length >= 2 ? `
      <div class="field">
        <label>Pair a couple</label>
        <div class="row-flex">
          <select id="pairA"><option value="">Person A</option>${options}</select>
          <select id="pairB"><option value="">Person B</option>${options}</select>
        </div>
        <button class="btn-primary" id="pairBtn" style="background:var(--pine);">Pair</button>
      </div>
    ` : ''}
    <div id="errorSlot"></div>
    ${assignmentTable}
    <div class="foot-link"><button class="btn-ghost" id="lockBtn">Exit admin</button></div>
  `;
}

function showError(msg){
  const slot = document.getElementById('errorSlot');
  if(slot) slot.innerHTML = `<div class="error">${msg}</div>`;
}

function generateDraw(){
  const ids = participants.map(p => p.id);
  const byId = Object.fromEntries(participants.map(p => [p.id, p]));
  let attempt = 0;
  while(attempt < 5000){
    attempt++;
    const shuffled = [...ids].sort(() => Math.random() - 0.5);
    let valid = true;
    for(let i = 0; i < ids.length; i++){
      const giverId = ids[i];
      const receiverId = shuffled[i];
      if(giverId === receiverId){ valid = false; break; }
      if(byId[giverId].partnerId && byId[giverId].partnerId === receiverId){ valid = false; break; }
    }
    if(valid){
      const result = {};
      ids.forEach((giverId, i) => { result[giverId] = shuffled[i]; });
      return result;
    }
  }
  return null;
}

function bindEvents(){
  const revealBtn = document.getElementById('revealBtn');
  if(revealBtn){
    revealBtn.onclick = async () => {
      const input = document.getElementById('nameInput');
      const pinInput = document.getElementById('pinInput');
      const name = normalize(input.value);
      const pin = pinInput.value.trim();
      if(!name){ showError('Type your name first.'); return; }
      if(!pin){ showError('Enter your PIN too.'); return; }
      if(!assignments){ showError('The draw hasn\'t happened yet — check back soon.'); return; }
      const giver = participants.find(p => normalize(p.name) === name);
      if(!giver){ showError('That name isn\'t on the family list. Check the spelling, or ask the admin to add you.'); return; }
      if(giver.pin !== pin){ showError('That PIN doesn\'t match. Ask the admin to remind you.'); return; }
      const receiverId = assignments[giver.id];
      const receiver = participants.find(p => p.id === receiverId);
      if(!receiver){ showError('Something went wrong finding your match. Ask the admin to check.'); return; }
      window.__lastReceiver = receiver.name;
      view = 'result';
      render();
    };
  }
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.onclick = () => { view = 'home'; render(); };

  const adminLink = document.getElementById('adminLink');
  if(adminLink) adminLink.onclick = () => { view = 'admin-gate'; render(); };

  const backHomeBtn = document.getElementById('backHomeBtn');
  if(backHomeBtn) backHomeBtn.onclick = () => { view = 'home'; render(); };

  const unlockBtn = document.getElementById('unlockBtn');
  if(unlockBtn){
    unlockBtn.onclick = () => {
      const pass = document.getElementById('pass').value;
      if(pass === ADMIN_CODE){ view = 'admin'; render(); }
      else showError('Wrong passcode.');
    };
  }

  const lockBtn = document.getElementById('lockBtn');
  if(lockBtn) lockBtn.onclick = () => { view = 'home'; render(); };

  const addBtn = document.getElementById('addBtn');
  if(addBtn){
    addBtn.onclick = async () => {
      const input = document.getElementById('newName');
      const name = input.value.trim();
      if(!name){ showError('Enter a name to add.'); return; }
      if(participants.some(p => normalize(p.name) === normalize(name))){ showError('That name is already on the list.'); return; }
      participants.push({ id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), name, partnerId: null, pin: randomPin() });
      await saveParticipants();
      render();
    };
  }

  document.querySelectorAll('[data-remove]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-remove');
      participants = participants.filter(p => p.id !== id);
      participants.forEach(p => { if(p.partnerId === id) p.partnerId = null; });
      await saveParticipants();
      render();
    };
  });

  const pairBtn = document.getElementById('pairBtn');
  if(pairBtn){
    pairBtn.onclick = async () => {
      const a = document.getElementById('pairA').value;
      const b = document.getElementById('pairB').value;
      if(!a || !b || a === b){ showError('Pick two different people to pair.'); return; }
      const pa = participants.find(p => p.id === a);
      const pb = participants.find(p => p.id === b);
      pa.partnerId = b;
      pb.partnerId = a;
      await saveParticipants();
      render();
    };
  }

  const drawBtn = document.getElementById('drawBtn');
  if(drawBtn){
    drawBtn.onclick = async () => {
      const result = generateDraw();
      if(!result){ showError('Couldn\'t find a valid draw with these pairings — try adjusting who\'s paired up.'); return; }
      assignments = result;
      await saveAssignments();
      render();
    };
  }

  const saveAssignBtn = document.getElementById('saveAssignBtn');
  if(saveAssignBtn){
    saveAssignBtn.onclick = async () => {
      const selects = document.querySelectorAll('.assign-select');
      const newAssignments = {};
      const warnings = [];
      const byId = Object.fromEntries(participants.map(p => [p.id, p]));
      selects.forEach(sel => {
        const giverId = sel.getAttribute('data-giver');
        const receiverId = sel.value;
        newAssignments[giverId] = receiverId;
        const giver = byId[giverId];
        if(giver.partnerId === receiverId){
          warnings.push(`${giver.name} is now buying for their partner, ${byId[receiverId].name}.`);
        }
      });
      assignments = newAssignments;
      await saveAssignments();
      const warnSlot = document.getElementById('assignWarning');
      if(warnSlot){
        warnSlot.innerHTML = warnings.length
          ? `<div class="error">Saved — but heads up: ${warnings.join(' ')}</div>`
          : `<div class="hint">Saved.</div>`;
      }
    };
  }

  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn){
    resetBtn.onclick = async () => {
      if(!confirm('This clears the current draw so everyone redraws. Continue?')) return;
      assignments = null;
      await saveAssignments();
      render();
    };
  }
}

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
